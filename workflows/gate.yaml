# workflows/gate.yaml — per-push gate for handl-lang/bench.
#
# bench is a benchmark harness, not a shipped package: run.py drives
# the tasks/ matrix (handl vs bun/node/python/rust/c/…) and there is no
# test suite or package build. The honest floor is that every
# first-party script parses and compiles:
#
#   - ast.parse over run.py + tasks/*/python.py
#   - bash -n over run.sh
#
# The polyglot task sources (c.c, rust.rs, go.go, java.java, …) are
# benchmark payloads compiled by run.sh --build on the runner host —
# they are content, not gate inputs.
#
# Bupha/the fleet runner invokes:
#
#   GATE_REPO="$PWD" GATE_RESULTS="$PWD/.gate-results.jsonl" \
#     peregrin campaign run workflows/gate.yaml --result .ci-result.json
#
# Verdict: .ci-result.json `.conclusion` == "success" (result: rules map
# gate.pass/gate.fail + failure events).
name: gate-bench

result:
  - event: gate.pass
    conclusion: success
  - event: gate.fail
    conclusion: failure
  - event: gate.failed
    conclusion: failure
  - event: gate.init.failed
    conclusion: failure
  - event: gate.run.failed
    conclusion: failure

capabilities:
  env:
    - GATE_REPO
    - GATE_RESULTS

nodes:
  # --- init: validate inputs, fresh results file --------------------
  - id: gate.init
    driver: shell
    on: [start]
    emits: [gate.due, gate.init.failed]
    params:
      cmd: >-
        set -u;
        REPO="${config.gate.repo:-${env("GATE_REPO","")}}";
        [ -n "$REPO" ] || { echo "gate.repo is required — set GATE_REPO or config.gate.repo to an absolute checkout path"; exit 1; };
        [ -d "$REPO" ] || { echo "no such directory: $REPO"; exit 1; };
        RES="${config.gate.results:-${env("GATE_RESULTS","$HOME/.local/share/handl-gates/bench.results.jsonl")}}";
        mkdir -p "$(dirname "$RES")";
        : > "$RES";
        echo "gate-bench: repo=$REPO results=$RES"
      timeout: 60
      emit:
        "0": gate.due
        default: gate.init.failed

  # --- run: every first-party script parses -------------------------
  - id: gate.run
    driver: shell
    on: [gate.due]
    emits: [gate.done, gate.failed]
    params:
      repo: '${config.gate.repo:-${env("GATE_REPO","")}}'
      results: '${config.gate.results:-${env("GATE_RESULTS","$HOME/.local/share/handl-gates/bench.results.jsonl")}}'
      timeout: 300
      cmd: |
        set -uo pipefail
        REPO="${params.repo}"
        RESULTS="${params.results}"
        START=$(date +%s)
        cd "$REPO" && REPO="$(pwd)" || { echo "no such directory: ${params.repo}"; exit 1; }
        rc=0
        # python harness + per-task python implementations must parse
        # (ast.parse — no __pycache__ artifacts in the worktree)
        pyfiles="run.py $(ls tasks/*/python.py 2>/dev/null)"
        for f in $pyfiles; do
          [ -e "$f" ] || continue
          python3 -c 'import ast, sys; ast.parse(open(sys.argv[1]).read(), sys.argv[1])' "$f" \
            || { echo "syntax error: $f" >&2; rc=1; break; }
        done
        # shell entry points must parse
        if [ "$rc" -eq 0 ]; then
          for f in run.sh $(find tasks -name '*.sh' 2>/dev/null); do
            [ -e "$f" ] || continue
            bash -n "$f" || { echo "syntax error: $f" >&2; rc=1; break; }
          done
        fi
        [ "$rc" -eq 0 ] && echo "ci passed: bench scripts compile/parse"
        if [ -n "$RESULTS" ]; then
          esc=$(printf '%s' "$REPO" | sed 's/\\/\\\\/g; s/"/\\"/g')
          printf '{"family":"python","repo":"%s","rc":%s,"secs":%s}\n' "$esc" "$rc" "$(( $(date +%s) - START ))" >> "$RESULTS" 2>/dev/null || true
        fi
        exit $rc
      emit:
        "0": gate.done
        default: gate.failed

  # --- report: terminal verdict from the results record -------------
  - id: gate.report
    driver: shell
    on: [gate.done, gate.failed]
    emits: [gate.pass, gate.fail]
    params:
      cmd: >-
        set -u;
        F="${config.gate.results:-${env("GATE_RESULTS","$HOME/.local/share/handl-gates/bench.results.jsonl")}}";
        [ -s "$F" ] || { echo "no results record — gate produced nothing"; exit 1; };
        line=$(tail -n 1 "$F");
        rc=$(printf '%s' "$line" | sed -n 's/.*"rc":\([0-9][0-9]*\).*/\1/p');
        echo "gate-bench verdict: $line";
        [ "${rc:-1}" = "0" ]
      timeout: 60
      emit:
        "0": gate.pass
        default: gate.fail
